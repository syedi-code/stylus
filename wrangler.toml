# Cloudflare Pages configuration for stylus.
name = "stylus"
pages_build_output_dir = "dist"
compatibility_date = "2025-08-24"

# Branch main deploys production: stylus.socialeating.studio, plus
# anti.socialeating.studio and journal.ibrahimsyed.io, kept because bookmarks
# still use them. Branch staging deploys staging.stylus.pages.dev. Both happen
# in CI on push; see .github/workflows.
#
# WORKER_URL is set per environment on the Pages project, not here:
#   production  https://alexandria.socialeating.studio
#   preview     https://antisocial-worker-staging.iysyed01.workers.dev
#
# For local development, set VITE_API_URL in .env to bypass the proxy:
#   VITE_API_URL=http://localhost:8787/api
