# Cloudflare Pages configuration
name = "antisocial-media"
pages_build_output_dir = "dist"
compatibility_date = "2025-08-24"

# Environment variables:
#   WORKER_URL - Backend worker URL for the Pages Function proxy
#     Production: https://api.ibrahimsyed.io  (or antisocial-worker.iysyed01.workers.dev)
#     Staging:    https://antisocial-worker-staging.iysyed01.workers.dev
#
# Set via: wrangler pages secret put WORKER_URL --project=antisocial-media
#
# For local dev, set VITE_API_URL in .env to bypass the proxy:
#   VITE_API_URL=http://localhost:8787/api
