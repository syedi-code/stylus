# Cloudflare Pages config (example)
# Copy to wrangler.toml and fill in placeholders.

name = "<PROJECT_NAME>"
pages_build_output_dir = "dist"
compatibility_date = "<YYYY-MM-DD>"

# Required, set in the Pages dashboard or via `wrangler pages secret put`:
#   WORKER_URL - the alexandria worker to proxy /api/* to
#
# Local development can bypass the proxy instead, via VITE_API_URL in .env.
